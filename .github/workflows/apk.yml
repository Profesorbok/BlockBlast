name: Build APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Make throwaway signing key
        run: |
          keytool -genkey -v -keystore android/app/upload-keystore.jks -storepass android -keypass android -alias key -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=test"
          printf "storePassword=android\nkeyPassword=android\nkeyAlias=key\nstoreFile=upload-keystore.jks\n" > android/key.properties
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: blockblast-apk
          path: build/app/outputs/flutter-apk/app-release.apk
